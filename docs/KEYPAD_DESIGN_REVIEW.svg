  <text x="42" y="850" fill="#486581" font-family="sans-serif" font-size="16">입력키: 0~9 · 소수점 · 부호 · 루트 · 분수 · 파이만 제공 / 방향·삭제는 수식 편집 전용 / 전체 지움은 별도 확인</text>
